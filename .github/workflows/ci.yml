name: CI

# Build gate only. Deployment is owned by Vercel's Git integration, which
# builds this repo directly — this workflow just verifies that a push or pull
# request still type-checks and builds before it gets there.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # This workflow already caches the pnpm store explicitly below;
          # opt out of setup-node's own packageManager-based caching so
          # there's only one caching path.
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.23.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm run build` is `astro check && astro build`, which never invokes
      # ESLint or Prettier. Without these two steps a change that breaks
      # linting outright — an ESLint major that orphans the config file, say —
      # still reports a green build.
      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Build site
        run: pnpm run build
